[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchmark-social-signal"
version = "0.1.0"
description = "Public attention-signal feed for Benchmark Radar."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "certifi>=2025.1.31"
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1"
]

[tool.hatch.build.targets.wheel]
include = ["src/social_signal.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
