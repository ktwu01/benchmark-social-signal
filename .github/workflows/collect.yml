name: Collect Public Signals

on:
  schedule:
    - cron: "45 11 * * *"
  workflow_dispatch:

concurrency:
  group: collect-public-signals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and test
        run: |
          python -m pip install -e '.[dev]'
          ruff check .
          pytest -q
      - name: Collect public observations
        run: python src/social_signal.py
      - name: Persist feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "benchmark-social-signal[bot]"
          git config user.email "benchmark-social-signal[bot]@users.noreply.github.com"
          git add feed.json
          if git diff --cached --quiet; then
            echo "Feed is already current"
            exit 0
          fi
          git commit -m "Update public signal feed [skip ci]"
          git push
